[project]
name = "agent-space-protocol"
version = "0.0.0"
description = "Python SDK for the Agent Space Protocol: participants, spaces, transports and identity"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The base is the standard library: participant, space skeleton, the three transports,
# Ed25519 and validation all work without anything else. The extras do the same faster or
# more completely.
dependencies = []

classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
]

[project.optional-dependencies]
# WebSocket and HTTP on aiohttp: a server and client for many connections.
aiohttp = ["aiohttp>=3.10"]
# Ed25519 on cryptography: the same signatures, computed faster.
crypto = ["cryptography>=43"]
# Validation on jsonschema: every keyword of JSON Schema 2020-12.
validate = ["jsonschema>=4.23"]
all = ["agent-space-protocol[aiohttp,crypto,validate]"]

[project.urls]
Repository = "https://github.com/agent-space-protocol/python-sdk"
Specification = "https://github.com/agent-space-protocol/agentspaceprotocol"

[project.scripts]
agent-space-py = "agent_space.testing.__main__:main"

[dependency-groups]
dev = [
  "agent-space-protocol[all]",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_space"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
