[project]
name = "agent-space-protocol"
version = "0.0.0"
description = "Python SDK for the Agent Space Protocol: participants, spaces, transports and identity"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10",
  "cryptography>=43",
  "jsonschema>=4.23",
  "typing-extensions>=4.12",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
]

[project.urls]
Repository = "https://github.com/agent-space-protocol/python-sdk"
Specification = "https://github.com/agent-space-protocol/agentspaceprotocol"

[project.scripts]
agent-space-py = "agent_space.testing.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_space"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
